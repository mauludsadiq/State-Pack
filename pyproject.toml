[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-pack"
version = "0.1.1"
description = "The CDN for AI inference costs. 93% token reduction proven on OpenAI API."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["llm", "agents", "inference", "kv-cache", "tokens", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev    = ["pytest>=8", "httpx>=0.27", "build>=1.0"]

[project.scripts]
state-pack-server         = "state_pack.server:main"
state-pack-session-server = "state_pack.session_server:main"

[project.urls]
Homepage   = "https://github.com/mauludsadiq/State-Pack"
Repository = "https://github.com/mauludsadiq/State-Pack"

[tool.setuptools.packages.find]
where   = ["."]
include = ["state_pack*"]

[tool.setuptools.package-data]
state_pack = ["py.typed"]