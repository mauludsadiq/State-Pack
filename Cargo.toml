[package]
name = "state-pack"
version = "0.1.0"
edition = "2021"
description = "Content-addressed state packet transport for cached transformer state + delta payloads"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
